<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>My PhotoBooth</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #393939, #111 45%, #050505);
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 520px;
  margin: auto;
  padding: 18px 14px 35px;
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 27px;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin: 7px 0 15px;
}

/* CAMERA */

.camera {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border-radius: 24px;
  background: #000;
  box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.no-mirror video {
  transform: scaleX(1);
}

/* EFFECT */

.effect {
  position: absolute;
  left: 50%;
  top: 26%;
  transform: translateX(-50%);
  font-size: 90px;
  line-height: 1;
  z-index: 5;
  pointer-events: none;
  filter: drop-shadow(0 5px 5px rgba(0,0,0,.35));
  display: none;
}

.effect.show {
  display: block;
}

/* COUNTDOWN */

.countdown {
  position: absolute;
  inset: 0;
  z-index: 10;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 100px;
  font-weight: 900;

  text-shadow: 0 5px 25px #000;

  opacity: 0;
  pointer-events: none;
}

.countdown.show {
  opacity: 1;
}

/* STATUS */

.status {
  position: absolute;
  z-index: 20;

  bottom: 14px;
  left: 50%;

  transform: translateX(-50%);

  background: rgba(0,0,0,.7);

  padding: 8px 15px;

  border-radius: 30px;

  font-size: 13px;

  white-space: nowrap;
}

/* SCREEN FLASH */

.screen-flash {
  position: fixed;
  inset: 0;

  background: white;

  z-index: 99999;

  pointer-events: none;

  opacity: 0;
}

.screen-flash.active {
  animation: flash .3s ease-out;
}

@keyframes flash {

  0% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }

}

/* CONTROLS */

.controls {
  margin-top: 13px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;

  margin-bottom: 9px;
}

select,
button {
  border: 0;
  border-radius: 13px;

  padding: 13px;

  font-size: 14px;
  font-weight: bold;
}

select {
  background: #252525;
  color: white;
}

button {
  background: #292929;
  color: white;
}

button:active {
  transform: scale(.96);
}

.start {
  width: 100%;

  background: white;
  color: #111;

  font-size: 18px;

  padding: 16px;

  margin-top: 10px;
}

/* EFFECT BUTTONS */

.effect-title {
  font-size: 13px;
  color: #aaa;
  margin: 13px 0 7px;
}

.effects {
  display: flex;
  gap: 8px;

  overflow-x: auto;

  padding-bottom: 5px;
}

.effects::-webkit-scrollbar {
  display: none;
}

.effect-btn {
  min-width: 70px;
  flex-shrink: 0;

  background: #252525;

  font-size: 27px;

  padding: 9px;
}

.effect-btn span {
  display: block;
  font-size: 10px;
  margin-top: 4px;
}

.effect-btn.active {
  background: white;
  color: #111;
}

/* FILTERS */

.filters {
  display: flex;
  gap: 7px;

  overflow-x: auto;

  margin-top: 8px;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex-shrink: 0;

  padding: 10px 13px;

  font-size: 12px;
}

.filter.active {
  background: white;
  color: black;
}

/* OTHER BUTTONS */

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;

  margin-top: 9px;
}

.counter {
  text-align: center;

  color: #aaa;

  font-size: 13px;

  margin: 10px;
}

/* RESULT */

.preview {
  display: none;

  margin-top: 20px;
}

.preview.show {
  display: block;
}

.preview h3 {
  text-align: center;
}

canvas {
  width: 100%;

  display: block;

  background: white;

  border-radius: 16px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  margin-top: 10px;
}

.download {
  background: white;
  color: black;
}

/* ERROR */

.error {
  display: none;

  background: #551919;
  color: #ffdede;

  padding: 12px;

  border-radius: 12px;

  margin-top: 10px;

  font-size: 13px;
}

.error.show {
  display: block;
}
</style>
</head>

<body>

<div class="screen-flash" id="screenFlash"></div>

<div class="app">

<h1>IMEE PHOTOBOOTH</h1>

<div class="subtitle">
Take cute photos & make memories ✨
</div>

<!-- CAMERA -->

<div class="camera" id="camera">

  <video id="video"
         autoplay
         playsinline
         muted></video>

  <!-- HEAD EFFECT -->

  <div class="effect" id="effect">
    🎩
  </div>

  <!-- COUNTDOWN -->

  <div class="countdown" id="countdown"></div>

  <div class="status" id="status">
    Starting camera...
  </div>

</div>


<div class="controls">

<!-- TIMER / PHOTO COUNT -->

<div class="row">

<select id="timer">

<option value="3">
⏱ 3 Seconds
</option>

<option value="5">
⏱ 5 Seconds
</option>

<option value="10">
⏱ 10 Seconds
</option>

</select>


<select id="photoCount">

<option value="2">
📸 2 Photos
</option>

<option value="3">
📸 3 Photos
</option>

<option value="4">
📸 4 Photos
</option>

<option value="5">
📸 5 Photos
</option>

<option value="6">
📸 6 Photos
</option>

<option value="7">
📸 7 Photos
</option>

<option value="8">
📸 8 Photos
</option>

</select>

</div>


<!-- EFFECTS -->

<div class="effect-title">
✨ Choose an effect
</div>

<div class="effects">

<button class="effect-btn active"
        data-effect="none">

❌
<span>None</span>

</button>


<button class="effect-btn"
        data-effect="🎩">

🎩
<span>Top Hat</span>

</button>


<button class="effect-btn"
        data-effect="👑">

👑
<span>Crown</span>

</button>


<button class="effect-btn"
        data-effect="🐰">

🐰
<span>Bunny</span>

</button>


<button class="effect-btn"
        data-effect="🐱">

🐱
<span>Cat</span>

</button>


<button class="effect-btn"
        data-effect="🤠">

🤠
<span>Cowboy</span>

</button>


<button class="effect-btn"
        data-effect="🎀">

🎀
<span>Bow</span>

</button>


<button class="effect-btn"
        data-effect="🌸">

🌸
<span>Flower</span>

</button>


<button class="effect-btn"
        data-effect="🧢">

🧢
<span>Cap</span>

</button>

</div>


<!-- FILTERS -->

<div class="effect-title">
🎨 Photo filter
</div>

<div class="filters">

<button class="filter active"
        data-filter="none">
Normal
</button>

<button class="filter"
        data-filter="gray">
B&W
</button>

<button class="filter"
        data-filter="sepia">
Vintage
</button>

<button class="filter"
        data-filter="warm">
Warm
</button>

<button class="filter"
        data-filter="cool">
Cool
</button>

<button class="filter"
        data-filter="contrast">
Contrast
</button>

</div>


<!-- CAMERA OPTIONS -->

<div class="options">

<button id="cameraBtn">
🔄 Camera
</button>

<button id="mirrorBtn">
🪞 Mirror ON
</button>

</div>


<!-- START -->

<button class="start"
        id="startBtn">

📸 START PHOTOBOOTH

</button>

</div>


<div class="counter"
     id="counter">

0 / 4 photos

</div>


<!-- RESULT -->

<div class="preview"
     id="preview">

<h3>
Your Photobooth ✨
</h3>

<canvas id="result"></canvas>

<div class="actions">

<button id="retake">
↩ Retake
</button>

<button class="download"
        id="download">

⬇ Download

</button>

</div>

</div>


<div class="error"
     id="error"></div>

</div>


<script>

const video =
document.getElementById("video");

const camera =
document.getElementById("camera");

const effect =
document.getElementById("effect");

const countdown =
document.getElementById("countdown");

const statusText =
document.getElementById("status");

const screenFlash =
document.getElementById("screenFlash");

const timer =
document.getElementById("timer");

const photoCount =
document.getElementById("photoCount");

const startBtn =
document.getElementById("startBtn");

const cameraBtn =
document.getElementById("cameraBtn");

const mirrorBtn =
document.getElementById("mirrorBtn");

const counter =
document.getElementById("counter");

const preview =
document.getElementById("preview");

const result =
document.getElementById("result");

const retake =
document.getElementById("retake");

const download =
document.getElementById("download");

const errorBox =
document.getElementById("error");


let stream = null;

let facingMode = "user";

let mirror = true;

let selectedEffect = "none";

let selectedFilter = "none";

let photos = [];

let busy = false;


/* =========================
CAMERA
========================= */

async function startCamera() {

  try {

    errorBox.classList.remove("show");

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }


    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: facingMode,

          width: {
            ideal: 1280
          },

          height: {
            ideal: 1280
          }

        },

        audio: false

      });


    video.srcObject = stream;


    camera.classList.toggle(
      "no-mirror",
      !mirror
    );


    statusText.textContent =
      "Camera ready 📸";


  } catch (err) {

    console.error(err);

    errorBox.textContent =
      "Hindi ma-access ang camera. I-check ang Camera permission at siguraduhing HTTPS ang GitHub Pages.";

    errorBox.classList.add("show");

  }

}


/* =========================
EFFECT SELECTOR
========================= */

document
.querySelectorAll(".effect-btn")
.forEach(btn => {

  btn.addEventListener("click", () => {

    document
    .querySelectorAll(".effect-btn")
    .forEach(b =>
      b.classList.remove("active")
    );


    btn.classList.add("active");


    selectedEffect =
      btn.dataset.effect;


    if (
      selectedEffect === "none"
    ) {

      effect.classList.remove("show");

    } else {

      effect.textContent =
        selectedEffect;

      effect.classList.add("show");

    }

  });

});


/* =========================
FILTER SELECTOR
========================= */

document
.querySelectorAll(".filter")
.forEach(btn => {

  btn.addEventListener("click", () => {

    document
    .querySelectorAll(".filter")
    .forEach(b =>
      b.classList.remove("active")
    );


    btn.classList.add("active");


    selectedFilter =
      btn.dataset.filter;


    updateFilter();

  });

});


function updateFilter() {

  let filter = "none";


  if (selectedFilter === "gray") {

    filter =
      "grayscale(1)";

  }


  else if (
    selectedFilter === "sepia"
  ) {

    filter =
      "sepia(.8) contrast(1.05)";

  }


  else if (
    selectedFilter === "warm"
  ) {

    filter =
      "saturate(1.35) sepia(.15)";

  }


  else if (
    selectedFilter === "cool"
  ) {

    filter =
      "saturate(.9) hue-rotate(12deg)";

  }


  else if (
    selectedFilter === "contrast"
  ) {

    filter =
      "contrast(1.4)";

  }


  video.style.filter =
    filter;

}


/* =========================
MIRROR
========================= */

mirrorBtn.addEventListener(
  "click",
  () => {

    mirror = !mirror;


    mirrorBtn.textContent =
      mirror
      ? "🪞 Mirror ON"
      : "🪞 Mirror OFF";


    camera.classList.toggle(
      "no-mirror",
      !mirror
    );

  }
);


/* =========================
SWITCH CAMERA
========================= */

cameraBtn.addEventListener(
  "click",
  async () => {

    if (busy) return;


    facingMode =
      facingMode === "user"
      ? "environment"
      : "user";


    await startCamera();

  }
);


/* =========================
SLEEP
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


/* =========================
COUNTDOWN
========================= */

async function runCountdown(seconds) {

  countdown.classList.add("show");


  for (
    let i = seconds;
    i > 0;
    i--
  ) {

    countdown.textContent =
      i;

    await sleep(1000);

  }


  countdown.textContent =
    "📸";


  await sleep(300);


  countdown.classList.remove("show");

}


/* =========================
REAL PHONE FLASH
========================= */

async function realFlash() {

  /*
    Some Android browsers support
    the torch constraint.

    Front cameras normally don't
    have a controllable LED.
  */

  if (!stream) return;


  const track =
    stream.getVideoTracks()[0];


  if (!track) return;


  try {

    const capabilities =
      track.getCapabilities();


    if (
      capabilities &&
      capabilities.torch
    ) {

      await track.applyConstraints({

        advanced: [
          {
            torch: true
          }
        ]

      });


      await sleep(120);


      await track.applyConstraints({

        advanced: [
          {
            torch: false
          }
        ]

      });


      return true;

    }

  } catch (e) {

    console.log(
      "Torch not supported",
      e
    );

  }


  return false;

}


/* =========================
SCREEN FLASH
========================= */

function screenFlashEffect() {

  screenFlash.classList.remove(
    "active"
  );


  void screenFlash.offsetWidth;


  screenFlash.classList.add(
    "active"
  );

}


/* =========================
TAKE PHOTO
========================= */

async function takePhoto() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  /*
    Mirror photo
  */

  if (mirror) {

    ctx.translate(
      width,
      0
    );

    ctx.scale(
      -1,
      1
    );

  }


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
    Apply filter
  */

  if (
    selectedFilter !==
    "none"
  ) {

    const data =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );


    applyFilter(
      data,
      selectedFilter
    );


    ctx.putImageData(
      data,
      0,
      0
    );

  }


  /*
    Draw head effect
  */

  if (
    selectedEffect !==
    "none"
  ) {

    ctx.save();

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    /*
      Position near upper head.
    */

    ctx.font =
      `${Math.floor(width * .20)}px Arial`;

    ctx.fillText(
      selectedEffect,
      width / 2,
      height * .20
    );

    ctx.restore();

  }


  return canvas;

}


/* =========================
FILTER ENGINE
========================= */

function applyFilter(
  imageData,
  filter
) {

  const data =
    imageData.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    let r =
      data[i];

    let g =
      data[i + 1];

    let b =
      data[i + 2];


    if (
      filter === "gray"
    ) {

      const gray =
        .299 * r +
        .587 * g +
        .114 * b;

      r = gray;
      g = gray;
      b = gray;

    }


    else if (
      filter === "sepia"
    ) {

      const nr =
        r * .393 +
        g * .769 +
        b * .189;

      const ng =
        r * .349 +
        g * .686 +
        b * .168;

      const nb =
        r * .272 +
        g * .534 +
        b * .131;

      r = nr;
      g = ng;
      b = nb;

    }


    else if (
      filter === "warm"
    ) {

      r *= 1.10;
      g *= 1.03;
      b *= .90;

    }


    else if (
      filter === "cool"
    ) {

      r *= .90;
      g *= 1.00;
      b *= 1.12;

    }


    else if (
      filter === "contrast"
    ) {

      const f = 1.4;

      r =
        f * (r - 128) + 128;

      g =
        f * (g - 128) + 128;

      b =
        f * (b - 128) + 128;

    }


    data[i] =
      Math.max(
        0,
        Math.min(255, r)
      );

    data[i + 1] =
      Math.max(
        0,
        Math.min(255, g)
      );

    data[i + 2] =
      Math.max(
        0,
        Math.min(255, b)
      );

  }

}


/* =========================
START PHOTOBOOTH
========================= */

startBtn.addEventListener(
  "click",
  startPhotobooth
);


async function startPhotobooth() {

  if (busy) return;


  if (!stream) {

    await startCamera();

    if (!stream) return;

  }


  busy = true;

  startBtn.disabled =
    true;


  photos = [];


  preview.classList.remove(
    "show"
  );


  const total =
    Number(
      photoCount.value
    );


  const seconds =
    Number(
      timer.value
    );


  counter.textContent =
    `0 / ${total} photos`;


  for (
    let i = 0;
    i < total;
    i++
  ) {

    statusText.textContent =
      `Photo ${i + 1} of ${total}`;


    /*
      Countdown
    */

    await runCountdown(
      seconds
    );


    /*
      Try actual phone LED flash.
    */

    await realFlash();


    /*
      Always show screen flash
      so it works on phones that
      don't expose the torch.
    */

    screenFlashEffect();


    /*
      Capture AFTER flash starts.
    */

    const photo =
      await takePhoto();


    photos.push(
      photo
    );


    counter.textContent =
      `${photos.length} / ${total} photos`;


    await sleep(650);

  }


  statusText.textContent =
    "Done! 🎉";


  createGrid();


  preview.classList.add(
    "show"
  );


  busy = false;

  startBtn.disabled =
    false;

}


/* =========================
GRID
========================= */

function getGrid(total) {

  if (total === 2)
    return {
      cols: 1,
      rows: 2
    };


  if (total === 3)
    return {
      cols: 1,
      rows: 3
    };


  if (total === 4)
    return {
      cols: 2,
      rows: 2
    };


  if (total === 5)
    return {
      cols: 2,
      rows: 3
    };


  if (total === 6)
    return {
      cols: 2,
      rows: 3
    };


  if (total === 7)
    return {
      cols: 2,
      rows: 4
    };


  return {
    cols: 2,
    rows: 4
  };

}


/* =========================
CREATE RESULT
========================= */

function createGrid() {

  const total =
    photos.length;


  const grid =
    getGrid(total);


  const cols =
    grid.cols;

  const rows =
    grid.rows;


  const photoW =
    photos[0].width;

  const photoH =
    photos[0].height;


  const border =
    30;

  const gap =
    10;

  const footer =
    75;


  result.width =
    border * 2 +
    photoW * cols +
    gap * (cols - 1);


  result.height =
    border * 2 +
    photoH * rows +
    gap * (rows - 1) +
    footer;


  const ctx =
    result.getContext("2d");


  /*
    Background
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    result.width,
    result.height
  );


  /*
    Photos
  */

  photos.forEach(
    (photo, index) => {

      const row =
        Math.floor(
          index / cols
        );


      const col =
        index % cols;


      const x =
        border +
        col *
        (photoW + gap);


      const y =
        border +
        row *
        (photoH + gap);


      ctx.drawImage(
        photo,
        x,
        y,
        photoW,
        photoH
      );

    }
  );


  /*
    Footer
  */

  ctx.fillStyle =
    "#111";

  ctx.font =
    "bold 25px Arial";

  ctx.textAlign =
    "center";


  ctx.fillText(
    "PHOTOBOOTH ✨",
    result.width / 2,
    result.height - 28
  );

}


/* =========================
DOWNLOAD
========================= */

download.addEventListener(
  "click",
  () => {

    const link =
      document.createElement(
        "a"
      );


    link.download =
      `photobooth-${photos.length}.png`;


    link.href =
      result.toDataURL(
        "image/png"
      );


    link.click();

  }
);


/* =========================
RETAKE
========================= */

retake.addEventListener(
  "click",
  () => {

    photos = [];


    preview.classList.remove(
      "show"
    );


    counter.textContent =
      `0 / ${photoCount.value} photos`;


    statusText.textContent =
      "Ready 📸";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* =========================
COUNTER
========================= */

photoCount.addEventListener(
  "change",
  () => {

    counter.textContent =
      `0 / ${photoCount.value} photos`;

  }
);


/* =========================
START
========================= */

if (
  navigator.mediaDevices &&
  navigator.mediaDevices
    .getUserMedia
) {

  startCamera();

} else {

  errorBox.textContent =
