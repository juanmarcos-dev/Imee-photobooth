<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">

<title>Imee PhotoBooth</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 18px 14px 30px;
}

header {
  text-align: center;
  margin-bottom: 15px;
}

header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 2px;
}

header p {
  color: #aaa;
  font-size: 13px;
}

.camera {
  position: relative;
  width: 100%;
  aspect-ratio: 3/4;
  background: black;
  overflow: hidden;
  border-radius: 22px;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.no-mirror video {
  transform: scaleX(1);
}

.countdown {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 100px;
  font-weight: bold;
  text-shadow: 0 5px 25px black;
  opacity: 0;
  pointer-events: none;
}

.countdown.show {
  opacity: 1;
}

/* CAMERA FLASH */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
}

.flash.active {
  animation: cameraFlash .35s ease-out;
}

@keyframes cameraFlash {
  0% {
    opacity: 1;
  }

  30% {
    opacity: .95;
  }

  100% {
    opacity: 0;
  }
}

.status {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.7);
  padding: 8px 15px;
  border-radius: 30px;
  font-size: 13px;
  white-space: nowrap;
}

.controls {
  margin-top: 13px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 9px;
}

select,
button {
  border: 0;
  border-radius: 13px;
  padding: 13px;
  font-size: 14px;
  font-weight: bold;
}

select {
  background: #242424;
  color: white;
}

button {
  background: #292929;
  color: white;
}

button:active {
  transform: scale(.97);
}

.capture {
  width: 100%;
  background: white;
  color: black;
  font-size: 18px;
  padding: 16px;
  margin-top: 9px;
}

.capture:disabled {
  opacity: .4;
}

.filters {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin-bottom: 9px;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex: 0 0 auto;
  padding: 10px 13px;
  font-size: 12px;
}

.filter.active {
  background: white;
  color: black;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.counter {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin: 9px 0;
}

.preview {
  display: none;
  margin-top: 20px;
}

.preview.show {
  display: block;
}

.preview h3 {
  text-align: center;
}

canvas {
  width: 100%;
  display: block;
  background: white;
  border-radius: 14px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 9px;
}

.download {
  background: white;
  color: black;
}

.error {
  display: none;
  background: #551919;
  color: #ffdede;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
  font-size: 13px;
}

.error.show {
  display: block;
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<div class="app">

<header>
  <h1>PHOTOBOOTH</h1>
  <p>Take memories together ✨</p>
</header>

<div class="camera" id="camera">

  <video id="video" autoplay playsinline muted></video>

  <div class="countdown" id="countdown"></div>

  <div class="status" id="status">
    Starting camera...
  </div>

</div>

<div class="controls">

  <div class="row">

    <select id="timer">
      <option value="3">⏱ 3 Seconds</option>
      <option value="5">⏱ 5 Seconds</option>
      <option value="10">⏱ 10 Seconds</option>
    </select>

    <select id="shots">
      <option value="2">📸 2 Photos</option>
      <option value="3">📸 3 Photos</option>
      <option value="4">📸 4 Photos</option>
      <option value="5">📸 5 Photos</option>
      <option value="6">📸 6 Photos</option>
      <option value="7">📸 7 Photos</option>
      <option value="8">📸 8 Photos</option>
    </select>

  </div>

  <div class="filters">

    <button class="filter active" data-filter="none">
      Normal
    </button>

    <button class="filter" data-filter="gray">
      B&W
    </button>

    <button class="filter" data-filter="sepia">
      Vintage
    </button>

    <button class="filter" data-filter="warm">
      Warm
    </button>

    <button class="filter" data-filter="cool">
      Cool
    </button>

    <button class="filter" data-filter="contrast">
      Contrast
    </button>

  </div>

  <div class="options">

    <button id="cameraBtn">
      🔄 Camera
    </button>

    <button id="mirrorBtn">
      🪞 Mirror ON
    </button>

  </div>

  <button class="capture" id="capture">
    📸 START PHOTOBOOTH
  </button>

</div>

<div class="counter" id="counter">
  0 / 4 photos
</div>

<div class="preview" id="preview">

  <h3>Your PhotoBooth ✨</h3>

  <canvas id="result"></canvas>

  <div class="actions">

    <button id="retake">
      ↩ Retake
    </button>

    <button class="download" id="download">
      ⬇ Download
    </button>

  </div>

</div>

<div class="error" id="error"></div>

</div>

<script>

const video = document.getElementById("video");
const camera = document.getElementById("camera");
const flash = document.getElementById("flash");

const countdown = document.getElementById("countdown");
const status = document.getElementById("status");

const timer = document.getElementById("timer");
const shotsSelect = document.getElementById("shots");

const capture = document.getElementById("capture");
const cameraBtn = document.getElementById("cameraBtn");
const mirrorBtn = document.getElementById("mirrorBtn");

const counter = document.getElementById("counter");

const preview = document.getElementById("preview");
const result = document.getElementById("result");

const download = document.getElementById("download");
const retake = document.getElementById("retake");

const error = document.getElementById("error");

let stream = null;
let facingMode = "user";
let mirror = true;
let selectedFilter = "none";

let photos = [];
let busy = false;


/* =========================
   CAMERA
========================= */

async function startCamera() {

  try {

    error.classList.remove("show");

    if (stream) {
      stream.getTracks().forEach(
        track => track.stop()
      );
    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: facingMode,
          width: {
            ideal: 1280
          },
          height: {
            ideal: 1280
          }
        },

        audio: false

      });

    video.srcObject = stream;

    camera.classList.toggle(
      "no-mirror",
      !mirror
    );

    status.textContent =
      "Camera ready 📸";

  }

  catch (e) {

    console.error(e);

    error.textContent =
      "Hindi ma-access ang camera. I-check ang Camera permission at siguraduhing HTTPS ang website.";

    error.classList.add("show");

    status.textContent =
      "Camera unavailable";

  }

}


/* =========================
   FILTER
========================= */

document.querySelectorAll(".filter")
.forEach(button => {

  button.addEventListener("click", () => {

    document
      .querySelectorAll(".filter")
      .forEach(b =>
        b.classList.remove("active")
      );

    button.classList.add("active");

    selectedFilter =
      button.dataset.filter;

    updateVideoFilter();

  });

});


function updateVideoFilter() {

  switch(selectedFilter) {

    case "gray":
      video.style.filter =
        "grayscale(1)";
      break;

    case "sepia":
      video.style.filter =
        "sepia(.8) contrast(1.05)";
      break;

    case "warm":
      video.style.filter =
        "saturate(1.35) sepia(.15)";
      break;

    case "cool":
      video.style.filter =
        "saturate(.9) hue-rotate(12deg)";
      break;

    case "contrast":
      video.style.filter =
        "contrast(1.4)";
      break;

    default:
      video.style.filter =
        "none";

  }

}


/* =========================
   MIRROR
========================= */

mirrorBtn.addEventListener("click", () => {

  mirror = !mirror;

  mirrorBtn.textContent =
    mirror
      ? "🪞 Mirror ON"
      : "🪞 Mirror OFF";

  camera.classList.toggle(
    "no-mirror",
    !mirror
  );

});


/* =========================
   SWITCH CAMERA
========================= */

cameraBtn.addEventListener(
  "click",
  async () => {

    if (busy) return;

    facingMode =
      facingMode === "user"
        ? "environment"
        : "user";

    await startCamera();

  }
);


/* =========================
   SLEEP
========================= */

function sleep(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/* =========================
   COUNTDOWN
========================= */

async function runCountdown(seconds) {

  countdown.classList.add("show");

  for (
    let number = seconds;
    number > 0;
    number--
  ) {

    countdown.textContent =
      number;

    await sleep(1000);

  }

  countdown.textContent =
    "📸";

  await sleep(300);

  countdown.classList.remove("show");

}


/* =========================
   FLASH EFFECT
========================= */

function cameraFlash() {

  flash.classList.remove("active");

  /*
    Force browser reflow so animation
    can run again every photo.
  */

  void flash.offsetWidth;

  flash.classList.add("active");

}


/* =========================
   TAKE PHOTO
========================= */

function takePhoto() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  if (mirror) {

    ctx.translate(width, 0);
    ctx.scale(-1, 1);

  }

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  /*
    Apply filter to actual photo.
  */

  if (selectedFilter !== "none") {

    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );

    applyFilter(
      imageData,
      selectedFilter
    );

    ctx.putImageData(
      imageData,
      0,
      0
    );

  }

  return canvas;

}


/* =========================
   FILTER ENGINE
========================= */

function applyFilter(imageData, filter) {

  const data =
    imageData.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];

    if (filter === "gray") {

      const gray =
        .299 * r +
        .587 * g +
        .114 * b;

      r = gray;
      g = gray;
      b = gray;

    }

    else if (filter === "sepia") {

      const nr =
        r * .393 +
        g * .769 +
        b * .189;

      const ng =
        r * .349 +
        g * .686 +
        b * .168;

      const nb =
        r * .272 +
        g * .534 +
        b * .131;

      r = nr;
      g = ng;
      b = nb;

    }

    else if (filter === "warm") {

      r *= 1.10;
      g *= 1.03;
      b *= .90;

    }

    else if (filter === "cool") {

      r *= .90;
      g *= 1.00;
      b *= 1.12;

    }

    else if (filter === "contrast") {

      const factor = 1.4;

      r =
        factor * (r - 128) + 128;

      g =
        factor * (g - 128) + 128;

      b =
        factor * (b - 128) + 128;

    }

    data[i] =
      Math.max(0, Math.min(255, r));

    data[i + 1] =
      Math.max(0, Math.min(255, g));

    data[i + 2] =
      Math.max(0, Math.min(255, b));

  }

}


/* =========================
   PHOTOBOOTH
========================= */

capture.addEventListener(
  "click",
  startPhotobooth
);


async function startPhotobooth() {

  if (busy) return;

  if (!stream) {

    await startCamera();

    if (!stream) return;

  }

  busy = true;

  capture.disabled = true;

  photos = [];

  preview.classList.remove("show");

  const total =
    Number(shotsSelect.value);

  counter.textContent =
    `0 / ${total} photos`;

  const seconds =
    Number(timer.value);

  for (
    let i = 0;
    i < total;
    i++
  ) {

    status.textContent =
      `Photo ${i + 1} of ${total}`;

    await runCountdown(seconds);

    /*
      Flash happens exactly when
      the photo is captured.
    */

    cameraFlash();

    const photo =
      takePhoto();

    photos.push(photo);

    counter.textContent =
      `${photos.length} / ${total} photos`;

    /*
      Small pause between shots.
    */

    await sleep(700);

  }

  status.textContent =
    "Done! 🎉";

  createGrid();

  preview.classList.add("show");

  busy = false;

  capture.disabled = false;

}


/* =========================
   GRID CALCULATION
========================= */

function getGrid(total) {

  /*
    Maximum 8 photos.

    2 = 1 x 2
    3 = 1 x 3
    4 = 2 x 2
    5 = 2 x 3
    6 = 2 x 3
    7 = 2 x 4
    8 = 2 x 4
  */

  if (total === 2)
    return {
      cols: 1,
      rows: 2
    };

  if (total === 3)
    return {
      cols: 1,
      rows: 3
    };

  if (total === 4)
    return {
      cols: 2,
      rows: 2
    };

  if (total === 5)
    return {
      cols: 2,
      rows: 3
    };

  if (total === 6)
    return {
      cols: 2,
      rows: 3
    };

  if (total === 7)
    return {
      cols: 2,
      rows: 4
    };

  return {
    cols: 2,
    rows: 4
  };

}


/* =========================
   CREATE FINAL GRID
========================= */

function createGrid() {

  const total =
    photos.length;

  const grid =
    getGrid(total);

  const cols =
    grid.cols;

  const rows =
    grid.rows;

  const photoW =
    photos[0].width;

  const photoH =
    photos[0].height;

  const border = 30;
  const gap = 10;
  const footer = 80;

  const canvasW =
    border * 2 +
    photoW * cols +
    gap * (cols - 1);

  const canvasH =
    border * 2 +
    photoH * rows +
    gap * (rows - 1) +
    footer;

  result.width =
    canvasW;

  result.height =
    canvasH;

  const ctx =
    result.getContext("2d");

  /*
    White background
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    canvasW,
    canvasH
  );

  /*
    Photos
  */

  photos.forEach(
    (photo, index) => {

      const row =
        Math.floor(index / cols);

      const col =
        index % cols;

      const x =
        border +
        col * (photoW + gap);

      const y =
        border +
        row * (photoH + gap);

      ctx.drawImage(
        photo,
        x,
        y,
        photoW,
        photoH
      );

    }
  );

  /*
    Footer
  */

  ctx.fillStyle =
    "#111";

  ctx.font =
    "bold 26px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "PHOTOBOOTH ✨",
    canvasW / 2,
    canvasH - 28
  );

}


/* =========================
   DOWNLOAD
========================= */

download.addEventListener(
  "click",
  () => {

    const link =
      document.createElement("a");

    link.download =
      `photobooth-${photos.length}-photos.png`;

    link.href =
      result.toDataURL(
        "image/png"
      );

    link.click();

  }
);


/* =========================
   RETAKE
========================= */

retake.addEventListener(
  "click",
  () => {

    photos = [];

    preview.classList.remove("show");

    counter.textContent =
      "0 / " +
      shotsSelect.value +
      " photos";

    status.textContent =
      "Ready 📸";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* =========================
   SHOT COUNTER UPDATE
========================= */

shotsSelect.addEventListener(
  "change",
  () => {

    counter.textContent =
      "0 / " +
      shotsSelect.value +
      " photos";

  }
);


/* =========================
   START CAMERA
========================= */

if (
  navigator.mediaDevices &&
  navigator.mediaDevices.getUserMedia
) {

  startCamera();

} else {

  error.textContent =
    "Your browser does not support camera access.";

  error.classList.add("show");

}

</script>

</body>
</html>
